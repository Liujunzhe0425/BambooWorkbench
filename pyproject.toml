[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BambooWorkbench"
version = "1.3.3"
description = "竹简工作台：可插拔的本地品质数据桌面框架"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "pydantic>=2.10,<3",
  "platformdirs>=4.3,<5",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "PyYAML>=6,<7",
  "openpyxl>=3.1,<4",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
]
packaging = ["pyinstaller>=6.11,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "mock_modules*", "ui*"]
exclude = ["tests*"]
