<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#f6f8fb"/>
  <text x="60" y="68" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#152238">水煮实验 Markdown 报告结构对照</text>
  <text x="60" y="102" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">验收记录实测 vs v1.0.1 脱敏 41 文件回归</text>

  <rect x="55" y="135" width="515" height="475" rx="18" fill="#fff7f6" stroke="#e7aaa3" stroke-width="2"/>
  <text x="90" y="185" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#a53a32">整改前</text>
  <text x="90" y="222" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#384452">验收报告记录：约 140 行</text>
  <text x="90" y="254" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#384452">约 73 行包含 warning / 警告</text>
  <line x1="90" y1="280" x2="530" y2="280" stroke="#e7aaa3"/>
  <text x="90" y="322" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#6b3d39">• 正常文件逐个进入报告主体</text>
  <text x="90" y="360" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#6b3d39">• 同类 warning 重复堆叠</text>
  <text x="90" y="398" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#6b3d39">• 机器字段与业务结论混排</text>
  <text x="90" y="436" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#6b3d39">• 重点异常难以快速定位</text>
  <rect x="90" y="485" width="440" height="80" rx="10" fill="#f3d5d2"/>
  <text x="310" y="533" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#8f3029">阅读负担高</text>

  <rect x="630" y="135" width="515" height="475" rx="18" fill="#f2fbf6" stroke="#8bc7a2" stroke-width="2"/>
  <text x="665" y="185" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#227447">v1.0.1 整改后</text>
  <text x="665" y="222" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#384452">脱敏 41 文件回归：47 行</text>
  <text x="665" y="254" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#384452">正常文件不再逐条占据主体</text>
  <line x1="665" y1="280" x2="1105" y2="280" stroke="#8bc7a2"/>
  <text x="665" y="318" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#2f6044">1. 运行概况与任务计数</text>
  <text x="665" y="350" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#2f6044">2. 总体结论与关键指标</text>
  <text x="665" y="382" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#2f6044">3. 仅列异常、失败和待复核文件</text>
  <text x="665" y="414" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#2f6044">4. warning 按业务类别合并</text>
  <text x="665" y="446" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#2f6044">5. 下一步建议与技术附录分离</text>
  <rect x="665" y="485" width="440" height="80" rx="10" fill="#cdebd8"/>
  <text x="885" y="522" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1d6540">业务重点清晰</text>
  <text x="885" y="550" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#2f6044">完整审计字段仍保留在 Excel / JSON</text>

  <text x="600" y="650" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#7a8593">数据来源：客户验收第一轮 v1.0.1 整改说明与模块自动化脱敏回归</text>
</svg>
