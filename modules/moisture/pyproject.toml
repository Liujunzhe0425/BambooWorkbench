[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bamboo-moisture"
version = "1.3.0"
description = "BambooWorkbench moisture module contract shell"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "PyYAML>=6,<7",
    "openpyxl>=3.1,<4",
    "XlsxWriter>=3.2,<4",
    "Jinja2>=3.1,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
