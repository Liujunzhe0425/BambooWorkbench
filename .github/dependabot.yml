version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: integration
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    # Routine version updates are disabled because the project is no longer maintained.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
