name: package

'on':
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev,packaging]"
      - name: Build and verify portable bundle
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build_portable.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: BambooWorkbench-windows-portable
          path: dist/BambooWorkbench
          if-no-files-found: error
