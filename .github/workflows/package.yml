name: package

'on':
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows_release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install --upgrade pip
      - run: .\.venv\Scripts\python.exe -m pip install -e ".[dev,packaging]"
      - name: Run repository quality gate
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/verify_repo.ps1
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build portable bundle and installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build_installer.ps1
      - name: Verify installer lifecycle
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/verify_installer.ps1
      - name: Prepare release assets and checksums
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/prepare_release.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BambooWorkbench-v0.1.0-windows
          path: release-output/*
          if-no-files-found: error
          retention-days: 14
